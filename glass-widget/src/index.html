<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="glass" aria-label="桌面组件，可拖动">
    <div id="cover" class="cover" role="button" tabindex="0" aria-label="点击调整颜色，拖动旋转封面" title="点击调整颜色，拖动旋转封面"></div>
    <button type="button" id="play-toggle" class="play-toggle" aria-label="播放" aria-pressed="false">
      <svg class="icon-play" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.2c0-.9 1-1.4 1.8-.9l10.1 6.8c.7.5.7 1.4 0 1.8L9.8 19.7c-.8.5-1.8 0-1.8-.9z"/></svg>
      <svg class="icon-pause" aria-hidden="true" viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="2.25"/><rect x="13.5" y="4" width="4.5" height="16" rx="2.25"/></svg>
    </button>
    <button type="button" id="previous" class="track-toggle previous" aria-label="上一曲" title="上一曲" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h2v14H5zM19 5v14L8 12z"/></svg></button>
    <button type="button" id="next" class="track-toggle next" aria-label="下一曲" title="下一曲" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5h2v14h-2zM5 5v14l11-7z"/></svg></button>
    <section class="song-details" aria-label="歌曲信息">
      <div id="song-title" class="song-title">等待音乐</div>
      <div id="song-artist" class="song-artist">正在连接酷狗</div>
      <div id="lyric" class="lyric" role="status">等待连接</div>
      <input id="progress" class="progress" type="range" min="0" max="1000" value="0" aria-label="播放进度，当前版本暂不支持跳转" title="当前版本暂不支持进度跳转" disabled>
      <div class="times"><span id="elapsed">--:--</span><span id="duration">--:--</span></div>
    </section>
    <section id="color-panel" class="color-panel" aria-label="颜色设置" hidden>
      <header class="color-header"><div><h1>颜色设置</h1><p>选择颜色，或开启渐变</p></div><button id="color-done" type="button" aria-label="关闭颜色设置">完成</button></header>
      <div class="color-rows">
        <div class="color-row" data-target="glass"><span>玻璃底色</span><button type="button" class="transparent-option" aria-pressed="false">透明</button><label class="swatch" title="选择玻璃底色"><input type="color" aria-label="选择玻璃底色"></label><button type="button" class="gradient-toggle" aria-pressed="false">渐变</button></div>
        <div class="color-row" data-target="title"><span>歌名</span><label class="swatch" title="选择歌名颜色"><input type="color" aria-label="选择歌名颜色"></label><button type="button" class="gradient-toggle" aria-pressed="false">渐变</button></div>
        <div class="color-row" data-target="artist"><span>歌手</span><label class="swatch" title="选择歌手颜色"><input type="color" aria-label="选择歌手颜色"></label><button type="button" class="gradient-toggle" aria-pressed="false">渐变</button></div>
        <div class="color-row" data-target="lyric"><span>歌词</span><label class="swatch" title="选择歌词颜色"><input type="color" aria-label="选择歌词颜色"></label><button type="button" class="gradient-toggle" aria-pressed="false">渐变</button></div>
      </div>
      <footer class="color-footer"><span>更改自动保存</span><button type="button" id="color-reset">恢复默认</button></footer>
    </section>
    <div id="resize" class="resize" title="拖动调整组件大小" aria-label="拖动调整组件大小"></div>
    <button type="button" id="close" class="close" aria-label="关闭程序">
      <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3 3 13"/></svg>
    </button>
  </main>
  <script src="./main.js"></script>
  <script src="./colors.js"></script>
  <script type="module" src="./cover3d.js"></script>
  <script type="module" src="./player.js"></script>
</body>
</html>
